name: Sync generated docs

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get latest CLI tag
        id: tag
        run: |
          tag=$(gh api repos/git-pkgs/git-pkgs/releases/latest --jq '.tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clone CLI
        run: git clone --branch "$TAG" --depth 1 https://github.com/git-pkgs/git-pkgs.git cli
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod

      - name: Generate docs
        run: cd cli && go run scripts/generate-docs/main.go

      - name: Copy docs
        run: |
          mkdir -p content/docs/reference
          cp cli/docs/reference/*.md content/docs/reference/
          rm -rf cli

      - name: Sync governance docs
        run: |
          git clone --depth 1 https://github.com/git-pkgs/.github.git governance
          sync() {
            src="governance/$1"
            dst="content/$2"
            title=$(sed -n '1s/^# //p' "$src")
            {
              printf -- '---\ntitle: %s\neditURL: https://github.com/git-pkgs/.github/edit/main/%s\n---\n\n' "$title" "$1"
              tail -n +2 "$src" | sed '1{/^$/d}'
            } > "$dst"
          }
          sync CONTRIBUTING.md contributing.md
          sync SECURITY.md security.md
          sync CODE_OF_CONDUCT.md code-of-conduct.md
          sync SUPPORT.md support.md
          sed -i 's|(SECURITY.md)|(/security/)|g' content/support.md
          rm -rf governance

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync-generated-docs
          title: Sync generated docs
          commit-message: "Sync generated docs (git-pkgs ${{ steps.tag.outputs.tag }})"
          body: |
            Command reference generated from git-pkgs/git-pkgs@${{ steps.tag.outputs.tag }}.
            Governance pages synced from git-pkgs/.github.
          delete-branch: true
